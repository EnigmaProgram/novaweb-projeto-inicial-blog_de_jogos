<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <h1>Bem-vindo ao Perfil</h1>
    </header>
    <main>
        <form>
            <div>
                <img src="Astigmiautismo.jpg" alt="Foto de Perfil" width="150" 
                onmouseover="console.log('Mouse sobre a imagem')">
            </div>
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" value="Seu Nome">
            </div>
            <div class="form-group">
                <label for="nascimento">Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" value="2000-01-01">
            </div>
            <div class="form-group">
                <button type="button" onclick="mensagem()" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </main>
    <script type="text/javascript">
        function mensagem() {
            alert("Perfil salvo com sucesso!");
        }
    </script>
</body>

</html>
