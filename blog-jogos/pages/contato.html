<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - NovaWeb Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oxanium:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>


    <!-- BARRA LATERAL -->

    <aside class="barra-lateral">

        <div class="logo">

            <a href="../index.html">

                <div class="logo-imagem">
                    <img src="../assets/images/logo.png" alt="Logo da NovaWeb Studio">
                </div>

                <h2>GamersX</h2>

                <span>NovaWeb Studio</span>

            </a>

        </div>


        <!-- MENU -->

        <nav class="menu">

            <ul>

                <li>
                    <a href="../index.html">
                        Início
                    </a>
                </li>

                <li>
                    <a href="posts.html">
                        Notícias
                    </a>
                </li>

                <li>
                    <a href="sobre.html">
                        Sobre
                    </a>
                </li>

                <li>
                    <a href="contato.html" class="ativo">
                        Contato
                    </a>
                </li>

            </ul>

        </nav>

    </aside>


    <!-- CONTEÚDO -->

    <main class="conteudo">


        <!-- PESQUISA -->

        <section class="area-pesquisa">

            <details class="pesquisa">

                <summary aria-label="Abrir pesquisa">
                    🔍
                </summary>

                <form>

                    <input type="search" name="pesquisa" placeholder="Pesquisar notícias..."
                        aria-label="Pesquisar notícias">

                    <button type="submit" aria-label="Pesquisar">
                        🔍
                    </button>

                </form>

            </details>

        </section>


        <!-- CONTATO -->

        <section class="pagina-sobre">


            <div class="titulo-secao">

                <h1>
                    Entre em contato
                </h1>

            </div>


            <article class="bloco-conteudo">

                <h2>
                    Fale com a NovaWeb Studio
                </h2>

                <p>
                    Tem alguma dúvida, sugestão ou gostaria de enviar uma
                    mensagem para nossa equipe?
                </p>


                <form class="formulario-contato">


                    <label for="nome">
                        Nome
                    </label>

                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>


                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>


                    <label for="assunto">
                        Assunto
                    </label>

                    <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto" required>


                    <label for="mensagem">
                        Mensagem
                    </label>

                    <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem" rows="7"
                        required></textarea>


                    <button type="submit">
                        Enviar mensagem
                    </button>


                </form>

            </article>


        </section>


        <!-- RODAPÉ -->

        <footer class="rodape">

            <p>
                © 2026 NovaWeb Studio - Blog de Jogos
            </p>

        </footer>


    </main>

</body>

</html>
