<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aula 14 - CSS para Formulários</title>

    <link rel="stylesheet" href="estilo.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>Formulário de Cadastro</h1>

        <p class="descricao">
            Clique em Habilitar para editar cada campo.
        </p>

        <form>
            <div class="grupo-campo">
                <label for="nome">Nome completo — autofocus</label>

                <div class="linha-campo">
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        autofocus
                    >

                    <button type="button" data-target="nome">
                        Habilitar
                    </button>
                </div>
            </div>

            <div class="grupo-campo">
                <label for="email">E-mail — disabled</label>

                <div class="linha-campo">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        disabled
                    >

                    <button type="button" data-target="email">
                        Habilitar
                    </button>
                </div>
            </div>

            <div class="grupo-campo">
                <label for="telefone">Telefone — required</label>

                <div class="linha-campo">
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="Digite seu telefone"
                        required
                    >

                    <button type="button" data-target="telefone">
                        Habilitar
                    </button>
                </div>
            </div>

            <div class="grupo-campo">
                <label for="idade">Idade — readonly</label>

                <div class="linha-campo">
                    <input
                        type="number"
                        id="idade"
                        name="idade"
                        value="18"
                        min="1"
                        max="120"
                        readonly
                    >

                    <button type="button" data-target="idade">
                        Habilitar
                    </button>
                </div>
            </div>

            <p class="aviso">
                Ao perder o foco, o campo será bloqueado novamente.
            </p>
        </form>
    </main>

</body>
</html>
